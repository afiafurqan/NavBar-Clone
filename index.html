<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NavBar Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Rubik:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="stage">

    <!-- Navbar 1: logo left, links centered, button right -->
    <header class="navbar">
      <nav class="navbar-inner" aria-label="Primary">
        <a class="logo" href="#">LOGOBAKERY</a>

        <ul class="links links-center">
          <li><a href="#">Services</a></li>
          <li><a href="#">Projects</a></li>
          <li><a href="#">About</a></li>
        </ul>

        <a class="btn" href="#">Contact</a>
      </nav>
    </header>

    <!-- Navbar 2: links + button left, logo right -->
    <header class="navbar">
      <nav class="navbar-inner" aria-label="Primary">
        <div class="group">
          <ul class="links">
            <li><a href="#">Services</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">About</a></li>
          </ul>
          <a class="btn" href="#">Contact</a>
        </div>

        <a class="logo" href="#">LOGOBAKERY</a>
      </nav>
    </header>

    <!-- Navbar 3: logo left, links + button right -->
    <header class="navbar">
      <nav class="navbar-inner" aria-label="Primary">
        <a class="logo" href="#">LOGOBAKERY</a>

        <div class="group">
          <ul class="links">
            <li><a href="#">Services</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">About</a></li>
          </ul>
          <a class="btn" href="#">Contact</a>
        </div>
      </nav>
    </header>

  </main>

</body>
</html>
